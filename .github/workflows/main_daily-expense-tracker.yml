# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - daily-expense-tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://expensetracker.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_2f1a39da024948be9cddb1196cd71b55 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_052e3041419941079338ecaf1ae701e9 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: expensetracker.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2f1a39da024948be9cddb1196cd71b55 }}/expensetracker:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'daily-expense-tracker'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_2fa225fff2a84312b7cd4c98949745bf }}
        images: 'expensetracker.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_2f1a39da024948be9cddb1196cd71b55 }}/expensetracker:${{ github.sha }}'